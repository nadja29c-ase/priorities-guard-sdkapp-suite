[pytest]
# Test discovery
testpaths = tests mcp_server
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Excluded paths
# --------------
# tests/unit/mcp_focused: Focused app is deprecated (technically infeasible, ships nothing).
# 5 known stale failures exist behind this exclusion (2026-07-04):
#   - test_google_tools.py::TestDisconnectGoogleCalendarLogic::test_returns_success_message_after_disconnect
#   - test_mcp_auth_helpers.py::TestErrorBuilders::test_unauthorized_error_structure
#   - test_mcp_auth_helpers.py::TestErrorBuilders::test_unauthorized_error_www_authenticate_format
#   - test_mcp_auth_helpers.py::TestErrorBuilders::test_forbidden_error_structure
#   - test_mcp_auth_helpers.py::TestErrorBuilders::test_forbidden_error_www_authenticate_format
# If Focused is revisited, lift this exclusion and fix the stale tests.
# Note: Exclusion enforced via conftest.py collect_ignore, not pytest.ini
# (pytest.ini doesn't support collect_ignore_glob)

# Output configuration
addopts =
    -ra
    --strict-markers
    --tb=short
    --maxfail=5
    -m "not live"

# Test markers
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (slower, may use database/HTTP/Redis)
    oauth: OAuth provider tests
    mcp: MCP server tests
    focused: Focused app tests
    slow: Slow-running tests (skip in quick runs)
    live: Live network tests against production (run manually, not in CI)

# Asyncio configuration
asyncio_mode = auto
