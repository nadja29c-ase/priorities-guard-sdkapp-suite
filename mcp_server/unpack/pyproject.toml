[tool.poetry]
name = "unpack-mcp"
version = "0.1.0"
description = "Unpack MCP Server - A question-first sensemaking tool"
authors = ["Priority Guardian Team"]
readme = "README.md"
# Note: When extracted to standalone repo, add: packages = [{include = "unpack"}]

[tool.poetry.dependencies]
python = "^3.11"
mcp = {version = "^1.3.1", extras = ["cli"]}
pydantic = "^2.6.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
starlette = "^0.36.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
