<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Unpack App Icon</title>
  <desc>Diamond with lightning bolt on light background.</desc>

  <!-- Background (no rounded corners - platform applies cropping) -->
  <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"/>

  <!-- Rotated square (diamond) -->
  <g fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="18" width="28" height="28" transform="rotate(45 32 32)"/>
  </g>

  <!-- Lightning bolt -->
  <path d="M30 24
           L36 24
           L32 32
           L38 32
           L30 44
           L33 36
           L26 36 Z"
        fill="none"
        stroke="#FACC15"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
