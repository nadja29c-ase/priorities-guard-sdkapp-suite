<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulfilling Productivity – AI Tools for ChatGPT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: #fff;
            color: #1a1a1a;
            border-radius: 16px;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #666;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #999;
            margin-bottom: 1rem;
        }

        .app-card {
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.1),
                0 10px 20px rgba(0, 0, 0, 0.15),
                0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .app-icon {
            width: 28px;
            height: 28px;
        }

        .app-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .app-description {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            background: #111;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #333;
        }

        .footer-links {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .contact {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }

        .contact a {
            color: #2563eb;
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Fulfilling Productivity</h1>
    <p class="tagline">AI productivity tools for ChatGPT</p>

    <p class="section-label">Our Apps</p>

    <div class="app-card">
        <div class="app-header">
            <svg class="app-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"/>
                <rect x="18" y="18" width="28" height="28" transform="rotate(45 32 32)" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M30 24 L36 24 L32 32 L38 32 L30 44 L33 36 L26 36 Z" stroke="#FACC15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span class="app-name">Unpack</span>
        </div>
        <p class="app-description">Flips your brainstorming on its head. Generate questions to find better solutions.</p>
        <a href="https://chatgpt.com" class="btn">Try in ChatGPT →</a>
    </div>

    <div class="footer-links">
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
    </div>

    <p class="contact">Questions? <a href="mailto:support@fulfilling-productivity.com">support@fulfilling-productivity.com</a></p>
</div>

</body>
</html>
