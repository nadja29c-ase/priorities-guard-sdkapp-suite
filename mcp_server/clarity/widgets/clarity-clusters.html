<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clarity clusters</title>
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f7f7f8;
        --bg-card: #ffffff;
        --text-primary: #0d0d0d;
        --text-secondary: #6e6e80;
        --text-muted: #8e8ea0;
        --border-color: #e5e5e6;
        --shadow: rgba(0, 0, 0, 0.05);
        --pill-bg: #ececf1;
        --pill-text: #353540;
        --save-btn-bg: #10a37f;
        --save-btn-hover: #0d8a6a;
        --save-btn-text: #ffffff;
        --saved-indicator: #10a37f;
        --modal-overlay: rgba(0, 0, 0, 0.5);
      }

      .dark {
        --bg-primary: #212121;
        --bg-secondary: #2f2f2f;
        --bg-card: #2f2f2f;
        --text-primary: #ececec;
        --text-secondary: #b4b4b4;
        --text-muted: #8e8e8e;
        --border-color: #444444;
        --shadow: rgba(0, 0, 0, 0.2);
        --pill-bg: #444444;
        --pill-text: #ececec;
        --save-btn-bg: #10a37f;
        --save-btn-hover: #0d8a6a;
        --save-btn-text: #ffffff;
        --saved-indicator: #10a37f;
        --modal-overlay: rgba(0, 0, 0, 0.7);
      }

      html, body {
        width: 100%;
        min-height: 100%;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        padding: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .header-text {
        flex: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-left: 16px;
      }

      .title {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .subtitle {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* Save button styles */
      .save-btn {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        background: var(--save-btn-bg);
        color: var(--save-btn-text);
        border: none;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }

      .save-btn:hover:not(:disabled) {
        background: var(--save-btn-hover);
      }

      .save-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .save-btn.saving {
        opacity: 0.7;
        cursor: wait;
      }

      /* Saved indicator */
      .saved-indicator {
        display: none;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--saved-indicator);
        font-weight: 500;
      }

      .saved-indicator.visible {
        display: flex;
      }

      .saved-indicator svg {
        width: 14px;
        height: 14px;
      }

      /* Modal styles */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--modal-overlay);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.visible {
        display: flex;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 24px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      }

      .modal-title {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .modal-text {
        margin: 0 0 20px;
        font-size: 14px;
        color: var(--text-secondary);
      }

      .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }

      .modal-btn {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      .modal-btn-cancel {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }

      .modal-btn-cancel:hover {
        background: var(--border-color);
      }

      .modal-btn-confirm {
        background: var(--save-btn-bg);
        color: var(--save-btn-text);
        border: none;
      }

      .modal-btn-confirm:hover {
        background: var(--save-btn-hover);
      }

      .cluster-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }

      .cluster-card {
        border-radius: 12px;
        padding: 14px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        box-shadow: 0 1px 3px var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 120px;
      }

      .cluster-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .cluster-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .item-count {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        background: var(--pill-bg);
        color: var(--pill-text);
      }

      .cluster-summary {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 10px;
      }

      .items-list {
        margin: 0;
        padding: 0;
        list-style: none;
        flex-grow: 1;
      }

      .items-list li {
        font-size: 13px;
        color: var(--text-primary);
        margin-bottom: 6px;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .items-bullet {
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.4;
        flex-shrink: 0;
      }

      .items-text {
        flex: 1;
        line-height: 1.4;
        word-break: break-word;
      }

      .empty-state {
        padding: 24px;
        text-align: center;
        font-size: 14px;
        color: var(--text-secondary);
        background: var(--bg-secondary);
        border-radius: 12px;
      }

      /* Nested cluster styles */
      .subclusters-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }

      .subcluster-card {
        border-radius: 8px;
        padding: 10px 12px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
      }

      .subcluster-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 6px;
      }

      .subcluster-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
      }

      .subcluster-count {
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 600;
        background: var(--pill-bg);
        color: var(--pill-text);
      }

      .subcluster-items {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .subcluster-items li {
        font-size: 12px;
        color: var(--text-primary);
        margin-bottom: 4px;
        display: flex;
        align-items: flex-start;
        gap: 6px;
      }

      .subcluster-items .items-bullet {
        font-size: 12px;
      }

      .subcluster-items .items-text {
        font-size: 12px;
      }

      /* Tag pill styles */
      .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .tag-pill {
        padding: 2px 8px;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 500;
        background: var(--pill-bg);
        color: var(--pill-text);
        text-transform: lowercase;
      }

      .subcluster-card .tags-container {
        margin-top: 8px;
      }

      .subcluster-card .tag-pill {
        font-size: 10px;
        padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="header">
        <div class="header-text">
          <p class="title">Clarity Board</p>
          <p class="subtitle">
            Your thoughts grouped into clusters. Use the chat to rename, split, or reprioritize them.
          </p>
        </div>
        <div class="header-actions">
          <span id="saved-indicator" class="saved-indicator">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            Saved
          </span>
          <button id="save-btn" class="save-btn" disabled>Save</button>
        </div>
      </div>
      <div id="cluster-root"></div>
    </main>

    <!-- Confirmation Modal -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal">
        <h3 class="modal-title">Save Board?</h3>
        <p class="modal-text">This will replace your previously saved board. Continue?<br><small>Note: you can save only 1 Clarity Board.</small></p>
        <div class="modal-actions">
          <button id="modal-cancel" class="modal-btn modal-btn-cancel">Cancel</button>
          <button id="modal-confirm" class="modal-btn modal-btn-confirm">Save</button>
        </div>
      </div>
    </div>

    <script type="module">
      try {
        const rootEl = document.querySelector("#cluster-root");
        const saveBtn = document.querySelector("#save-btn");
        const savedIndicator = document.querySelector("#saved-indicator");
        const modalOverlay = document.querySelector("#modal-overlay");
        const modalCancel = document.querySelector("#modal-cancel");
        const modalConfirm = document.querySelector("#modal-confirm");

        let currentClusters = [];
        let savedBoardHash = null;
        let isSaving = false;
        let isInitialized = false;

        const applyTheme = () => {
          const theme = window.openai?.theme ?? "light";
          document.body.classList.remove("light", "dark");
          document.body.classList.add(theme);
        };

        const getToolOutput = () => {
          const t = window.openai?.toolOutput;
          console.log("getToolOutput raw:", JSON.stringify(t, null, 2));  // TEMP DEBUG
          if (!t) return { clusters: [], savedBoardHash: null };

          // Try all known paths for clusters
          let clusters = [];
          if (Array.isArray(t.result?.structuredContent?.clusters)) {
            clusters = t.result.structuredContent.clusters;
          } else if (Array.isArray(t.structuredContent?.clusters)) {
            clusters = t.structuredContent.clusters;
          } else if (Array.isArray(t.clusters)) {
            clusters = t.clusters;
          } else if (Array.isArray(t.data?.clusters)) {
            clusters = t.data.clusters;
          } else if (Array.isArray(t.result?.clusters)) {
            clusters = t.result.clusters;
          }

          // Get saved_board_hash - try all paths
          let hash = null;
          hash = hash || t.result?.structuredContent?.saved_board_hash;
          hash = hash || t.structuredContent?.saved_board_hash;
          hash = hash || t.saved_board_hash;
          hash = hash || t.result?.saved_board_hash;
          hash = hash || t.data?.saved_board_hash;

          return { clusters, savedBoardHash: hash };
        };

        // Compute SHA256 hash of clusters (must match backend algorithm EXACTLY)
        // CANONICAL HASH SPECIFICATION:
        // - Explicit key order (NOT alphabetical): cluster_name, subclusters, tags, thought_items
        // - NFC Unicode normalization
        // - Clusters sorted alphabetically by cluster_name
        // - Subclusters sorted alphabetically by subcluster_name
        // - thought_items and tags sorted lexicographically
        // - No whitespace in JSON
        const computeContentHash = async (clusters) => {
          const normalizeSubcluster = (s) => ({
            // Key order: subcluster_name, tags, thought_items
            subcluster_name: (s.subcluster_name || "").trim().normalize("NFC"),
            tags: (s.tags || []).map(t => t.trim().normalize("NFC")).sort(),
            thought_items: (s.thought_items || []).map(i => i.trim().normalize("NFC")).sort(),
          });

          const normalizeCluster = (c) => ({
            // Key order: cluster_name, subclusters, tags, thought_items
            cluster_name: (c.cluster_name || "").trim().normalize("NFC"),
            subclusters: (c.subclusters || [])
              .map(normalizeSubcluster)
              .sort((a, b) => a.subcluster_name.localeCompare(b.subcluster_name)),
            tags: (c.tags || []).map(t => t.trim().normalize("NFC")).sort(),
            thought_items: (c.thought_items || []).map(i => i.trim().normalize("NFC")).sort(),
          });

          // Sort clusters by cluster_name, normalize all content
          const normalized = clusters
            .map(normalizeCluster)
            .sort((a, b) => a.cluster_name.localeCompare(b.cluster_name));

          // Key order is determined by object literal construction above
          // JSON.stringify preserves insertion order in modern JS engines
          const canonical = JSON.stringify({ clusters: normalized });
          const encoder = new TextEncoder();
          const data = encoder.encode(canonical);
          const hashBuffer = await crypto.subtle.digest("SHA-256", data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        };

        const truncateText = (text, maxLength = 80) => {
          if (!text || text.length <= maxLength) return text;
          return text.substring(0, maxLength).trim() + "...";
        };

        const updateSaveButtonState = async () => {
          if (currentClusters.length === 0) {
            saveBtn.disabled = true;
            savedIndicator.classList.remove("visible");
            return;
          }

          saveBtn.disabled = false;

          // Check if current state matches saved state
          if (savedBoardHash) {
            const currentHash = await computeContentHash(currentClusters);
            if (currentHash === savedBoardHash) {
              savedIndicator.classList.add("visible");
            } else {
              savedIndicator.classList.remove("visible");
            }
          } else {
            savedIndicator.classList.remove("visible");
          }
        };

        const showModal = () => {
          modalOverlay.classList.add("visible");
        };

        const hideModal = () => {
          modalOverlay.classList.remove("visible");
        };

        const handleSave = async () => {
          if (isSaving || currentClusters.length === 0) return;

          isSaving = true;
          saveBtn.classList.add("saving");
          saveBtn.textContent = "Saving...";

          try {
            // Call save_board tool via OpenAI API
            if (window.openai?.callTool) {
              const result = await window.openai.callTool("save_board", {
                confirmed: true,
                clusters: currentClusters
              });

              // Check if save was successful
              const content = result?.structuredContent || result?.result?.structuredContent || result;
              if (content?.saved === true && content?.saved_board_hash) {
                savedBoardHash = content.saved_board_hash;
                savedIndicator.classList.add("visible");
              }
            } else {
              console.warn("window.openai.callTool not available");
            }
          } catch (err) {
            console.error("Save failed:", err);
          } finally {
            isSaving = false;
            saveBtn.classList.remove("saving");
            saveBtn.textContent = "Save";
            hideModal();
          }
        };

        // Event listeners
        saveBtn.addEventListener("click", showModal);
        modalCancel.addEventListener("click", hideModal);
        modalConfirm.addEventListener("click", handleSave);
        modalOverlay.addEventListener("click", (e) => {
          if (e.target === modalOverlay) hideModal();
        });

        const render = () => {
          applyTheme();
          const { clusters, savedBoardHash: newHash } = getToolOutput();

          // Don't initialize until we have actual data
          if (!isInitialized && clusters.length > 0) {
            // First render WITH data - freeze our clusters
            currentClusters = clusters;
            savedBoardHash = newHash;
            isInitialized = true;

            // Render DOM
            rootEl.innerHTML = "";

            const grid = document.createElement("div");
            grid.className = "cluster-grid";

            clusters.forEach((cluster) => {
              const card = document.createElement("div");
              card.className = "cluster-card";

              const header = document.createElement("div");
              header.className = "cluster-header";

              const nameEl = document.createElement("div");
              nameEl.className = "cluster-name";
              nameEl.textContent = truncateText(cluster.cluster_name, 40) || "Untitled cluster";
              header.appendChild(nameEl);

              const badge = document.createElement("div");
              badge.className = "item-count";
              badge.textContent = cluster.sum_thought_items;
              header.appendChild(badge);

              card.appendChild(header);

              if (cluster.summary) {
                const summaryEl = document.createElement("div");
                summaryEl.className = "cluster-summary";
                summaryEl.textContent = truncateText(cluster.summary, 100);
                card.appendChild(summaryEl);
              }

              const items = Array.isArray(cluster.thought_items) ? cluster.thought_items : [];
              const subclusters = Array.isArray(cluster.subclusters) ? cluster.subclusters : [];

              // Render ungrouped items first (if any)
              if (items.length > 0) {
                const list = document.createElement("ul");
                list.className = "items-list";

                items.forEach((rawText) => {
                  const li = document.createElement("li");
                  const bullet = document.createElement("span");
                  bullet.className = "items-bullet";
                  bullet.textContent = "\u2022";
                  const text = document.createElement("span");
                  text.className = "items-text";
                  text.textContent = rawText;
                  li.appendChild(bullet);
                  li.appendChild(text);
                  list.appendChild(li);
                });

                card.appendChild(list);
              }

              // Render subclusters below (if any)
              if (subclusters.length > 0) {
                const subContainer = document.createElement("div");
                subContainer.className = "subclusters-container";

                subclusters.forEach((subcluster) => {
                  const subCard = document.createElement("div");
                  subCard.className = "subcluster-card";

                  const subHeader = document.createElement("div");
                  subHeader.className = "subcluster-header";

                  const subName = document.createElement("div");
                  subName.className = "subcluster-name";
                  subName.textContent = truncateText(subcluster.subcluster_name, 30) || "Untitled";
                  subHeader.appendChild(subName);

                  const subBadge = document.createElement("div");
                  subBadge.className = "subcluster-count";
                  subBadge.textContent = subcluster.sum_thought_items || subcluster.thought_items?.length || 0;
                  subHeader.appendChild(subBadge);

                  subCard.appendChild(subHeader);

                  const subItems = Array.isArray(subcluster.thought_items) ? subcluster.thought_items : [];
                  if (subItems.length) {
                    const subList = document.createElement("ul");
                    subList.className = "subcluster-items";

                    subItems.forEach((rawText) => {
                      const li = document.createElement("li");
                      const bullet = document.createElement("span");
                      bullet.className = "items-bullet";
                      bullet.textContent = "\u2022";
                      const text = document.createElement("span");
                      text.className = "items-text";
                      text.textContent = rawText;
                      li.appendChild(bullet);
                      li.appendChild(text);
                      subList.appendChild(li);
                    });

                    subCard.appendChild(subList);
                  }

                  // Render subcluster tags
                  const subTags = Array.isArray(subcluster.tags) ? subcluster.tags : [];
                  if (subTags.length > 0) {
                    const subTagsContainer = document.createElement("div");
                    subTagsContainer.className = "tags-container";
                    subTags.forEach((tag) => {
                      const pill = document.createElement("span");
                      pill.className = "tag-pill";
                      pill.textContent = tag;
                      subTagsContainer.appendChild(pill);
                    });
                    subCard.appendChild(subTagsContainer);
                  }

                  subContainer.appendChild(subCard);
                });

                card.appendChild(subContainer);
              }

              // Render cluster tags
              const clusterTags = Array.isArray(cluster.tags) ? cluster.tags : [];
              if (clusterTags.length > 0) {
                const tagsContainer = document.createElement("div");
                tagsContainer.className = "tags-container";
                clusterTags.forEach((tag) => {
                  const pill = document.createElement("span");
                  pill.className = "tag-pill";
                  pill.textContent = tag;
                  tagsContainer.appendChild(pill);
                });
                card.appendChild(tagsContainer);
              }

              grid.appendChild(card);
            });

            rootEl.appendChild(grid);
            updateSaveButtonState();

          } else if (!isInitialized && clusters.length === 0) {
            // No data yet - show empty state but DON'T lock initialization
            // This allows re-render when openai:set_globals fires with actual data
            rootEl.innerHTML = "";
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = "No clusters yet. Ask in chat to organize your brain dump into clusters.";
            rootEl.appendChild(empty);
            updateSaveButtonState();
            return;  // Don't set isInitialized - allow re-render when data arrives

          } else {
            // Subsequent renders (isInitialized=true) - only update saved indicator
            if (newHash) {
              computeContentHash(currentClusters).then(ourHash => {
                if (ourHash === newHash) {
                  savedBoardHash = newHash;
                  savedIndicator.classList.add("visible");
                } else {
                  savedBoardHash = null;
                  savedIndicator.classList.remove("visible");
                }
              });
            }
            // Don't re-render DOM or change currentClusters
          }
        };

        render();
        window.addEventListener("openai:set_globals", () => render(), { passive: true });

      } catch (err) {
        console.error("WIDGET ERROR:", err);
      }
    </script>
  </body>
</html>
