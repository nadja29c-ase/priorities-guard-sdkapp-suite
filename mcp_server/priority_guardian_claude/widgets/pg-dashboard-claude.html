<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priority Guardian Dashboard</title>
  <style>
    /* CSS tokens - copy from constants.ts color values */
    :root {
      /* Light theme defaults */
      --bg-main: #f5f5f5;
      --bg-card: #ffffff;
      --bg-subtle: #ebebeb;
      --text-primary: #0d0d0d;
      --text-secondary: #5c5c5c;
      --text-tertiary: #8c8c8c;
      --border: #e5e5e5;
      --border-subtle: #f0f0f0;

      /* Keyword colors - exact values from constants.ts BADGE_COLORS/RING_STROKE_COLORS */
      --color-p1: #0285ff;
      --color-p2: #924ff7;
      --color-p3: #ffc300;
      --badge-p1-bg: rgba(2, 133, 255, 0.12);
      --badge-p2-bg: rgba(146, 79, 247, 0.12);
      --badge-p3-bg: rgba(255, 195, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #141414;
        --bg-card: #1e1e1e;
        --bg-subtle: #2a2a2a;
        --text-primary: #efefef;
        --text-secondary: #a0a0a0;
        --text-tertiary: #606060;
        --border: #2e2e2e;
        --border-subtle: #242424;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 16px;
    }

    .dashboard {
      max-width: 400px;
      margin: 0 auto;
    }

    .error-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .error-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* TimeAllocationBar styles */
    .time-allocation {
      margin-bottom: 20px;
    }

    .time-allocation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .time-allocation-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .time-allocation-total {
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    .time-allocation-daterange {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .time-allocation-bar {
      height: 8px;
      border-radius: 9999px;
      overflow: hidden;
      display: flex;
      gap: 1px;
      background: var(--bg-subtle);
    }

    .time-allocation-bar .segment {
      height: 100%;
    }

    .time-allocation-bar .segment:first-child {
      border-radius: 9999px 0 0 9999px;
    }

    .time-allocation-bar .segment:last-child {
      border-radius: 0 9999px 9999px 0;
    }

    .time-allocation-bar .segment:only-child {
      border-radius: 9999px;
    }

    .time-allocation-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 16px;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-label {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    .legend-label.other {
      font-style: italic;
      color: var(--text-tertiary);
    }

    /* Card base styles */
    .card {
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .card.p1 { border-left: 4px solid var(--color-p1); }
    .card.p2 { border-left: 4px solid var(--color-p2); }
    .card.p3 { border-left: 4px solid var(--color-p3); }

    /* Deadline card banner */
    .deadline-banner {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
    }

    .deadline-banner-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .deadline-banner-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .deadline-banner-days {
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    /* Card body */
    .card-body {
      padding: 20px;
    }

    /* Header row */
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .keyword-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .keyword-badge.p1 { background: var(--badge-p1-bg); color: var(--color-p1); }
    .keyword-badge.p2 { background: var(--badge-p2-bg); color: var(--color-p2); }
    .keyword-badge.p3 { background: var(--badge-p3-bg); color: var(--color-p3); }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .streak-pill {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding: 2px 6px;
      border-radius: 9999px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--bg-subtle);
    }

    /* Lead measure (deadline card) */
    .lead-measure {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .lead-measure-number {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--text-primary);
    }

    .lead-measure-number .total {
      font-size: 20px;
      font-weight: 400;
      color: var(--text-tertiary);
    }

    .lead-measure-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* HourRing + stats row (flexible card) */
    .ring-stats-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .hour-ring {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .hour-ring svg {
      width: 100%;
      height: 100%;
    }

    .hour-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hour-ring-actual {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .hour-ring-target {
      font-size: 10px;
      color: var(--text-tertiary);
      line-height: 1.2;
    }

    .stats-content {
      flex: 1;
    }

    .stats-avg {
      font-size: 28px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--text-primary);
    }

    .stats-avg-label {
      font-size: 12px;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .stats-tracking {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-tracking svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--text-tertiary);
    }

    .stats-tracking span {
      font-size: 14px;
      font-style: italic;
      color: var(--text-tertiary);
    }

    /* Collapsible section */
    .collapsible-section {
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .collapsible-header {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: transparent;
      border: none;
      padding: 0;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }

    .collapsible-header:hover {
      opacity: 0.8;
    }

    .collapsible-title {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
    }

    .collapsible-count {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-tertiary);
    }

    .collapsible-chevron {
      margin-left: auto;
      transition: transform 0.2s ease;
    }

    .collapsible-chevron.expanded {
      transform: rotate(180deg);
    }

    .collapsible-content {
      display: none;
    }

    .collapsible-content.expanded {
      display: block;
    }

    /* Deliverable/Goal items */
    .item-list {
      list-style: none;
      margin-bottom: 8px;
    }

    .item-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 4px 0;
    }

    .item-checkbox {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .item-text {
      font-size: 14px;
      color: var(--text-primary);
    }

    .item-text.done {
      text-decoration: line-through;
      color: var(--text-tertiary);
    }

    /* Google Calendar status */
    .gcal-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .gcal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .gcal-dot.connected {
      background: #22c55e;
    }

    .gcal-dot.disconnected {
      background: var(--text-tertiary);
    }
  </style>
</head>
<body>
  <div id="app" class="dashboard"></div>

  <script>
    // Data embedded by Claude when creating the artifact
    const DASHBOARD_DATA = null; // REPLACE WITH ACTUAL JSON DATA

    // ============================================================
    // Utility functions - copied from utils.ts
    // ============================================================

    // Copy from utils.ts exactly
    function formatHours(hours) {
      if (hours === 0) return '0h'
      const rounded = Math.round(hours * 10) / 10
      const formatted = rounded % 1 === 0 ? rounded.toFixed(0) : rounded.toFixed(1)
      return `${formatted}h`
    }

    // Copy from utils.ts exactly
    function daysUntil(dateStr) {
      const target = new Date(dateStr)
      const today = new Date()
      today.setHours(0, 0, 0, 0)
      target.setHours(0, 0, 0, 0)
      const diffMs = target.getTime() - today.getTime()
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24))
    }

    // Copy from utils.ts exactly
    function keywordToNumber(keyword) {
      if (keyword === 'P1') return 1
      if (keyword === 'P2') return 2
      if (keyword === 'P3') return 3
      return 999
    }

    // Copy from utils.ts exactly
    function sortPrioritiesByKeyword(priorities) {
      return [...priorities].sort((a, b) => {
        return keywordToNumber(a.calendarKeyword) - keywordToNumber(b.calendarKeyword)
      })
    }

    // Copy from TimeAllocationBar.tsx exactly - parse ISO date parts directly
    function parseDateParts(isoString) {
      const datePart = isoString.split('T')[0]
      const [year, month, day] = datePart.split('-').map(Number)
      return { year, month, day }
    }

    // Copy from TimeAllocationBar.tsx exactly - weekEnd is exclusive (subtract 1 day)
    function formatDateRange(weekStart, weekEnd) {
      const start = parseDateParts(weekStart)
      const end = parseDateParts(weekEnd)
      const startDate = new Date(start.year, start.month - 1, start.day)
      const endDate = new Date(end.year, end.month - 1, end.day - 1) // subtract 1 day (exclusive)
      const currentYear = new Date().getFullYear()
      const opts = { month: 'short', day: 'numeric' }
      if (start.year !== currentYear) opts.year = 'numeric'
      const startStr = startDate.toLocaleDateString('en-US', opts)
      const endOpts = { month: 'short', day: 'numeric' }
      if (endDate.getFullYear() !== currentYear) endOpts.year = 'numeric'
      const endStr = endDate.toLocaleDateString('en-US', endOpts)
      return `${startStr} – ${endStr}`
    }

    // ============================================================
    // HourRing - copied from HourRing.tsx exactly
    // ============================================================

    // Copied from HourRing.tsx - do not change these values
    const VIEWBOX_SIZE = 64
    const CENTER = VIEWBOX_SIZE / 2  // 32
    const RADIUS = 26
    const STROKE_WIDTH = 5
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS  // ~163.36

    function buildHourRing(actual, target, keyword) {
      const percentage = Math.min((actual / target) * 100, 100)
      const dashoffset = CIRCUMFERENCE - (CIRCUMFERENCE * percentage / 100)
      const strokeColors = {
        P1: 'var(--color-p1)',
        P2: 'var(--color-p2)',
        P3: 'var(--color-p3)',
      }
      const strokeColor = strokeColors[keyword] || strokeColors.P1
      return `
        <div class="hour-ring">
          <svg viewBox="0 0 ${VIEWBOX_SIZE} ${VIEWBOX_SIZE}">
            <circle cx="${CENTER}" cy="${CENTER}" r="${RADIUS}"
              fill="none" stroke="var(--border-subtle)" stroke-width="${STROKE_WIDTH}" />
            ${percentage > 0 ? `
            <circle cx="${CENTER}" cy="${CENTER}" r="${RADIUS}"
              fill="none" stroke="${strokeColor}" stroke-width="${STROKE_WIDTH}"
              stroke-linecap="round"
              stroke-dasharray="${CIRCUMFERENCE}"
              stroke-dashoffset="${dashoffset}"
              style="transform:rotate(-90deg);transform-origin:center" />
            ` : ''}
          </svg>
          <div class="hour-ring-center">
            <span class="hour-ring-actual">${formatHours(actual)}</span>
            <span class="hour-ring-target">/ ${formatHours(target)}</span>
          </div>
        </div>`
    }

    // ============================================================
    // SVG Icons
    // ============================================================

    function calendarIcon(color) {
      return `
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="${color}" stroke-width="1.5">
          <rect x="2" y="3" width="12" height="11" rx="1.5" />
          <path d="M5 1.5v3M11 1.5v3M2 7h12" />
        </svg>`
    }

    function hourglassIcon() {
      return `
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 2h8M4 14h8M5 2v2c0 1.5 1 3 3 4-2 1-3 2.5-3 4v2M11 2v2c0 1.5-1 3-3 4 2 1 3 2.5 3 4v2" />
        </svg>`
    }

    function chevronIcon(expanded) {
      return `
        <svg class="collapsible-chevron ${expanded ? 'expanded' : ''}" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6l4 4 4-4" />
        </svg>`
    }

    function checkboxIcon(checked) {
      if (checked) {
        return `
          <svg class="item-checkbox" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="14" height="14" rx="2" fill="var(--text-secondary)" />
            <path d="M4 8l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>`
      }
      return `
        <svg class="item-checkbox" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="14" height="14" rx="2" stroke="var(--border)" stroke-width="1.5" />
        </svg>`
    }

    // ============================================================
    // TimeAllocationBar - copied from TimeAllocationBar.tsx
    // ============================================================

    function buildTimeAllocationBar(timeAllocation, activeKeywords) {
      if (!timeAllocation) return ''

      const { weekStart, weekEnd, totalTrackedHours, barSegments, otherHours } = timeAllocation
      const dateRange = formatDateRange(weekStart, weekEnd)

      // Calculate segment widths - copy from TimeAllocationBar.tsx
      const MIN_SEGMENT_PERCENT = 2
      const segments = []

      if (totalTrackedHours > 0) {
        for (const kw of activeKeywords) {
          const hours = barSegments[kw]
          if (hours > 0) {
            const percent = (hours / totalTrackedHours) * 100
            segments.push({
              key: kw,
              width: Math.max(percent, MIN_SEGMENT_PERCENT),
              color: `var(--color-${kw.toLowerCase()})`,
            })
          }
        }

        if (otherHours > 0) {
          const percent = (otherHours / totalTrackedHours) * 100
          segments.push({
            key: 'other',
            width: Math.max(percent, MIN_SEGMENT_PERCENT),
            color: 'var(--bg-subtle)',
          })
        }

        // Normalize widths to sum to 100%
        const totalWidth = segments.reduce((sum, s) => sum + s.width, 0)
        if (totalWidth > 100) {
          const scale = 100 / totalWidth
          for (const s of segments) {
            s.width *= scale
          }
        }
      }

      // Build legend items
      const legendItems = []
      for (const kw of activeKeywords) {
        legendItems.push({
          key: kw,
          label: kw,
          hours: timeAllocation.keywords[kw]?.hours || 0,
          isOther: false,
        })
      }
      legendItems.push({
        key: 'other',
        label: 'Other',
        hours: otherHours,
        isOther: true,
      })

      const segmentsHtml = segments.map(s =>
        `<div class="segment" style="width:${s.width}%;background:${s.color}"></div>`
      ).join('')

      const legendHtml = legendItems.map(item => `
        <div class="legend-item">
          <span class="legend-dot" style="background:${item.isOther ? 'var(--bg-subtle)' : `var(--color-${item.key.toLowerCase()})`}"></span>
          <span class="legend-label ${item.isOther ? 'other' : ''}">${item.label} ${formatHours(item.hours)}</span>
        </div>
      `).join('')

      return `
        <section class="time-allocation">
          <div class="time-allocation-header">
            <span class="time-allocation-label">THIS WEEK</span>
            <span class="time-allocation-total">${formatHours(totalTrackedHours)}</span>
          </div>
          <p class="time-allocation-daterange">${dateRange}</p>
          <div class="time-allocation-bar">
            ${totalTrackedHours === 0 ? '' : segmentsHtml}
          </div>
          <div class="time-allocation-legend">
            ${legendHtml}
          </div>
        </section>`
    }

    // ============================================================
    // DeadlineCard - copied from DeadlineCard.tsx
    // ============================================================

    function buildDeadlineCard(priority) {
      const kw = priority.calendarKeyword.toLowerCase()
      const days = priority.deadline ? daysUntil(priority.deadline) : null
      const doneCount = (priority.deliverables || []).filter(d => d.done).length
      const totalCount = (priority.deliverables || []).length

      // Format deadline date
      const deadlineDate = priority.deadline
        ? new Date(priority.deadline + 'T00:00:00').toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
          })
        : ''

      // Days remaining text
      let daysText = ''
      if (days !== null) {
        if (days > 0) {
          daysText = `${days} day${days === 1 ? '' : 's'} left`
        } else if (days === 0) {
          daysText = 'Due today'
        } else {
          daysText = `${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'} overdue`
        }
      }

      // Icon color
      const iconColors = {
        p1: 'var(--color-p1)',
        p2: 'var(--color-p2)',
        p3: 'var(--color-p3)',
      }
      const iconColor = iconColors[kw] || iconColors.p1

      // Deliverables list
      const deliverablesHtml = (priority.deliverables || []).map(d => `
        <li>
          ${checkboxIcon(d.done)}
          <span class="item-text ${d.done ? 'done' : ''}">${escapeHtml(d.name)}</span>
        </li>
      `).join('')

      return `
        <article class="card ${kw}">
          <div class="deadline-banner">
            <div class="deadline-banner-left">
              ${calendarIcon(iconColor)}
              <span class="deadline-banner-date">${deadlineDate}</span>
            </div>
            <span class="deadline-banner-days">${daysText}</span>
          </div>
          <div class="card-body">
            <div class="card-header">
              <span class="keyword-badge ${kw}">${priority.calendarKeyword}</span>
              <h3 class="card-title">${escapeHtml(priority.name)}</h3>
            </div>
            <div class="lead-measure">
              <span class="lead-measure-number">${doneCount}<span class="total">/${totalCount}</span></span>
              <span class="lead-measure-label">deliverables done</span>
            </div>
            <div class="collapsible-section" data-section="deliverables-${priority.id}">
              <button class="collapsible-header" onclick="toggleSection('deliverables-${priority.id}')">
                <span class="collapsible-title">E2E DELIVERABLES</span>
                <span class="collapsible-count">(${doneCount}/${totalCount})</span>
                ${chevronIcon(false)}
              </button>
              <div class="collapsible-content" id="deliverables-${priority.id}">
                ${totalCount > 0 ? `<ul class="item-list">${deliverablesHtml}</ul>` : '<p style="font-size:12px;font-style:italic;color:var(--text-secondary)">No deliverables yet</p>'}
              </div>
            </div>
          </div>
        </article>`
    }

    // ============================================================
    // FlexibleCard - copied from FlexibleCard.tsx
    // ============================================================

    function buildFlexibleCard(priority) {
      const kw = priority.calendarKeyword.toLowerCase()
      const hasAvg = priority.avgTargetAchievement != null
      const actual = priority.weeklyHourActual ?? priority.actualHours ?? 0
      const target = priority.weeklyHourTarget

      // Streak pill
      const streakHtml = (priority.streakCount != null && priority.streakCount > 0)
        ? `<span class="streak-pill">${priority.streakCount}-week streak</span>`
        : ''

      // HourRing + stats
      let ringStatsHtml = ''
      if (target != null) {
        const statsHtml = hasAvg
          ? `<div class="stats-content">
               <span class="stats-avg">~${Math.round(priority.avgTargetAchievement)}%</span>
               <p class="stats-avg-label">of weekly target on avg</p>
             </div>`
          : `<div class="stats-content">
               <div class="stats-tracking">
                 ${hourglassIcon()}
                 <span>Tracking in progress</span>
               </div>
             </div>`

        ringStatsHtml = `
          <div class="ring-stats-row">
            ${buildHourRing(actual, target, priority.calendarKeyword)}
            ${statsHtml}
          </div>`
      }

      // Goals list
      const goals = priority.goals || []
      const goalsHtml = goals.map(g => `
        <li>
          ${checkboxIcon(g.achieved)}
          <span class="item-text ${g.achieved ? 'done' : ''}">${escapeHtml(g.text)}</span>
        </li>
      `).join('')

      // Checkpoint date
      const checkpointStr = priority.checkpointDate
        ? new Date(priority.checkpointDate + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : ''

      return `
        <article class="card ${kw}">
          <div class="card-body">
            <div class="card-header">
              <span class="keyword-badge ${kw}">${priority.calendarKeyword}</span>
              <h3 class="card-title">${escapeHtml(priority.name)}</h3>
              ${streakHtml}
            </div>
            ${ringStatsHtml}
            <div class="collapsible-section" data-section="goals-${priority.id}">
              <button class="collapsible-header" onclick="toggleSection('goals-${priority.id}')">
                <span class="collapsible-title">GOALS</span>
                ${checkpointStr ? `<span class="collapsible-count">${checkpointStr}</span>` : ''}
                ${chevronIcon(false)}
              </button>
              <div class="collapsible-content" id="goals-${priority.id}">
                ${goals.length > 0 ? `<ul class="item-list">${goalsHtml}</ul>` : '<p style="font-size:12px;font-style:italic;color:var(--text-secondary)">No goals yet</p>'}
              </div>
            </div>
          </div>
        </article>`
    }

    // ============================================================
    // Helpers
    // ============================================================

    function escapeHtml(str) {
      if (!str) return ''
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
    }

    function toggleSection(sectionId) {
      const content = document.getElementById(sectionId)
      const section = content.closest('.collapsible-section')
      const chevron = section.querySelector('.collapsible-chevron')

      if (content.classList.contains('expanded')) {
        content.classList.remove('expanded')
        chevron.classList.remove('expanded')
      } else {
        content.classList.add('expanded')
        chevron.classList.add('expanded')
      }
    }

    // ============================================================
    // Main render
    // ============================================================

    function render() {
      const app = document.getElementById('app')

      // Graceful error state when DASHBOARD_DATA is undefined
      if (typeof DASHBOARD_DATA === 'undefined' || DASHBOARD_DATA === null) {
        app.innerHTML = `
          <div class="error-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4M12 16h.01" />
            </svg>
            <p>No dashboard data available</p>
          </div>`
        return
      }

      const data = DASHBOARD_DATA
      const priorities = data.priorities || []
      const sorted = sortPrioritiesByKeyword(priorities)
      const deadlines = sorted.filter(p => p.type === 'deadline')
      const flexible = sorted.filter(p => p.type === 'flexible')

      // Active keywords for TimeAllocationBar
      const activeKeywords = [...new Set(priorities.map(p => p.calendarKeyword))].sort((a, b) => keywordToNumber(a) - keywordToNumber(b))

      let html = ''

      // TimeAllocationBar - only if google_connected and timeAllocation present
      if (data.google_connected && data.timeAllocation) {
        html += buildTimeAllocationBar(data.timeAllocation, activeKeywords)
      }

      // Deadline cards
      for (const p of deadlines) {
        html += buildDeadlineCard(p)
      }

      // Flexible cards
      for (const p of flexible) {
        html += buildFlexibleCard(p)
      }

      // Google Calendar status
      html += `
        <div class="gcal-status">
          <span class="gcal-dot ${data.google_connected ? 'connected' : 'disconnected'}"></span>
          <span>${data.google_connected ? 'Google Calendar connected' : 'Google Calendar not connected'}</span>
        </div>`

      app.innerHTML = html
    }

    // Run on load
    render()
  </script>
</body>
</html>
